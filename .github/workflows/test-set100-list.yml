name: Test SET100 List

on:
  workflow_dispatch:

jobs:
  test-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test SET100 list
        run: python test-set100-list.py
