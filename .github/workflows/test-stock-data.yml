
name: Test daily stock data

on:
  workflow_dispatch:
  schedule:
    - cron: "45 11 * * 1-5"

permissions:
  contents: write

jobs:
  fetch-test-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stock prices
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          symbols = [
              line.strip().upper()
              for line in Path("set100.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]

          symbols = [
              s if s.endswith(".BK") else s + ".BK"
              for s in symbols
          ]

          print("Stocks loaded:", len(symbols))

          stocks = {}
          errors = []

          for symbol in symbols:
              try:
                  url = (
                      "https://query1.finance.yahoo.com/v8/finance/chart/"
                      + symbol + "?range=6mo&interval=1d"
                  )
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)

                  result = payload.get("chart", {}).get("result")
                  if not result:
                      raise RuntimeError("No price data returned")

                  chart = result[0]
                  timestamps = chart.get("timestamp", [])
                  quote = chart["indicators"]["quote"][0]
                  closes = quote.get("close", [])
                  rows = []

                  for ts, close in zip(timestamps, closes):
                      if close is not None:
                          rows.append({
                              "date": datetime.fromtimestamp(
                                  ts, timezone.utc
                              ).date().isoformat(),
                              "close": round(float(close), 4)
                          })

                  if len(rows) < 30:
                      raise RuntimeError("Too few daily prices")

                  stocks[symbol] = rows
                  print(f"{symbol}: saved {len(rows)} prices")
                  time.sleep(1)

              except Exception as error:
                  errors.append(f"{symbol}: {error}")
                  print(f"FAILED {symbol}: {error}")

          if len(stocks) < 4:
              raise RuntimeError(
                  "Fewer than four stocks downloaded: " + "; ".join(errors)
              )

          output = {
              "source": "Yahoo Finance unofficial test source",
              "fetched_at_utc": datetime.now(timezone.utc).isoformat(),
              "symbols_requested": symbols,
              "stocks": stocks,
              "errors": errors
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/set100-prices.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Saved data for {len(stocks)} stocks")
          PY

      - name: Commit test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/set100-prices.json
          git diff --cached --quiet || git commit -m "Update test stock prices"
          git push
