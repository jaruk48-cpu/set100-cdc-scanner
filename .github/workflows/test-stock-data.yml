
name: Test daily stock data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  fetch-test-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch test price data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          symbol = "ADVANC.BK"
          url = (
              "https://query1.finance.yahoo.com/v8/finance/chart/"
              + symbol + "?range=3mo&interval=1d"
          )
          req = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          result = data.get("chart", {}).get("result")
          if not result:
              raise RuntimeError("No price data returned")

          chart = result[0]
          timestamps = chart.get("timestamp", [])
          closes = chart["indicators"]["quote"][0].get("close", [])
          rows = [
              {
                  "date": datetime.fromtimestamp(
                      ts, timezone.utc
                  ).date().isoformat(),
                  "close": round(float(close), 4)
              }
              for ts, close in zip(timestamps, closes)
              if close is not None
          ]

          if len(rows) < 27:
              raise RuntimeError("Too few daily prices")

          output = {
              "source": "Yahoo Finance unofficial test source",
              "symbol": symbol,
              "fetched_at_utc": datetime.now(timezone.utc).isoformat(),
              "rows": rows
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/test-price.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Saved {len(rows)} daily prices")
          PY

      - name: Commit test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/test-price.json
          git diff --cached --quiet || git commit -m "Update test stock price data"
          git push
          
